<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prompt Tag Finder</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#111111" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="top">
    <div class="title">
      <div class="logo">🏷️</div>
      <div>
        <div class="h1">Prompt Tag Finder</div>
        <div class="sub">日本語/英語/カテゴリで検索。NSFWはデフォルト非表示。</div>
      </div>
    </div>
    <div class="meta">
      <span id="datasetInfo">loading…</span>
      <button class="btn ghost" id="btnInstall" hidden>インストール</button>
    </div>
  </header>

  <main class="wrap">
    <section class="panel">
      <div class="row">
        <input id="q" class="input" placeholder="検索（例：逆光 / bokeh / ポーズ / lingerie）" />
        <button class="btn" id="btnClear">クリア</button>
      </div>

      <div class="row filters">
        <label class="field">
          <div class="label">カテゴリ</div>
          <select id="fCategory" class="select"></select>
        </label>
<label class="field tight">
          <div class="label">NSFW表示</div>
          <div class="checkline">
            <input type="checkbox" id="fNSFW" />
            <span>ONで候補に追加</span>
          </div>
        </label>
        <label class="field tight">
          <div class="label">NSFW上限</div>
          <select id="fNsfwMax" class="select" disabled>
            <option value="1">1（匂わせ）</option>
            <option value="2">2（露出/強め）</option>
            <option value="3">3（露骨/行為）</option>
          </select>
        </label>
        <label class="field tight">
          <div class="label">追加表示</div>
          <div class="checkcol">
            <label class="checkline"><input type="checkbox" id="fAgeRisk" /> <span>年齢誤解リスク</span></label>
            <label class="checkline"><input type="checkbox" id="fConsentRisk" /> <span>同意誤解リスク</span></label>
          </div>
        </label>
      </div>

      <div class="row stats">
        <div><span id="hitCount">0</span> hits</div>
        <div class="spacer"></div>
        <button class="btn ghost" id="btnCopyEN">ENをコピー</button>
        <button class="btn ghost" id="btnCopyJP">JPをコピー</button>
        <button class="btn danger" id="btnResetSel">選択をリセット</button>
      </div>

      <div class="selected">
        <div class="label">選択中（EN）</div>
        <textarea id="outEN" class="textarea" rows="3" readonly></textarea>
        <div class="label">選択中（JP）</div>
        <textarea id="outJP" class="textarea" rows="3" readonly></textarea>
      </div>
    </section>

    <section class="panel">
      <div class="row">
        <div class="h2">結果</div>
        <div class="spacer"></div>
        <div class="hint">クリックで追加/解除</div>
      </div>
      <div id="list" class="list"></div>
    </section>

    <footer class="foot">
      <div>© Observation World Studio (tool template) — v0.1.2</div>
    </footer>
  </main>

  <script src="./app.js"></script>
</body>
</html>
